# Server Port: Matches React frontend proxy (3001)
server.port=3001

# MongoDB Connection String (with quick 2s timeout for graceful offline fallback)
spring.data.mongodb.uri=mongodb://localhost:27017/rivalry-arena?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000
spring.data.mongodb.auto-index-creation=false

# Logging
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.mongodb.driver=ERROR
logging.level.com.rivalryarena=INFO
